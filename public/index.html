<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><title>TECH SIGNAL</title><style> *{box-sizing:border-box}body{margin:0;background:#101722;color:#e6edf5;font:16px/1.6 system-ui}main,header{max-width:1000px;margin:auto;padding:24px}header{border-bottom:1px solid #344352;display:flex;justify-content:space-between;align-items:center}strong,a{color:#65e1cf}h1{font-size:clamp(40px,8vw,82px);line-height:1;letter-spacing:-.05em;margin:24px 0}h2{line-height:1.2}small{color:#aab9ca;text-transform:uppercase;letter-spacing:.12em}article{border-top:1px solid #344352;padding:24px 0}select,input,button{background:#1c2938;color:white;border:1px solid #526477;border-radius:8px;padding:12px;font:inherit;max-width:100%}nav{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.hero{padding:28px;background:linear-gradient(135deg,#203d43,#16212e);border-radius:16px}a{overflow-wrap:anywhere}footer{padding:30px;color:#aab9ca}</style><header><strong>TECH / SIGNAL</strong><small>Daily intelligence</small></header><main><section class="hero"><small id="date">Continuous news feed</small><h1>Stay ahead.</h1><p>AI, hardware, infrastructure and the people shaping technology.</p></section><nav><select id="category" aria-label="Category"><option>All</option><option>AI</option><option>Hardware</option><option>Executives</option><option>Security</option><option>Development</option><option>Infrastructure</option></select><input id="search" placeholder="Search stories" aria-label="Search stories"><button onclick="print()">Print / Save PDF</button></nav><div id="status" role="status"></div><section id="stories"></section><footer>Technology news · TECH SIGNAL</footer></main><script>const $=id=>document.getElementById(id);let editions=[];function render(){$('stories').replaceChildren();for(const e of editions){const group=document.createElement('section');const heading=document.createElement('h2');heading.textContent=e.date;group.append(heading);let count=0;for(const s of e.stories||[]){if($('category').value!=='All'&&s.category!==$('category').value)continue;if(!JSON.stringify(s).toLowerCase().includes($('search').value.toLowerCase()))continue;const a=document.createElement('article');for(const [tag,value] of [['small',s.category+' / '+(s.status||'Reported')],['h2',s.title],['p',s.summary],['p',s.why?'Why it matters: '+s.why:'']]){const el=document.createElement(tag);el.textContent=value;a.append(el)}group.append(a);count++}if(count){if(e.note){const p=document.createElement('small');p.textContent=e.note;group.insertBefore(p,heading.nextSibling)}$('stories').append(group)}}}for(const id of ['category','search'])$(id).addEventListener('input',render);fetch('editions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{editions=d.sort((a,b)=>b.date.localeCompare(a.date));$('date').textContent='Continuous news feed';render()}).catch(()=>$('status').textContent='News unavailable.');</script></html>
